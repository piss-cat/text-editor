<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>funny editor</title>
        <link href="stylesheets/style.css" rel="stylesheet">
    </head>
    <body>
        <header>
            <h1>best editor evr :3</h1>
        </header>
        <main>
            <section class="editoral-features">
                <button onclick="boldText()">give milk</button>
                <button onclick="italicText()">fancy fuck</button>
                <button onclick="alignTextLeft()">slide to da left</button>
                <button onclick="alignTextRight()">slide to da right</button>
                <button onclick="alignTextCenter()">criss cross</button>
                <button onclick="upperText()">make it BIG</button>
                <button onclick="lowerText()">make it tiny</button>
                <button onclick="capitalizeText()">make it be special for no reason</button>
                <button onclick="clearStyle()">make it plain</button>
                <button onclick="clearText(); clearStyle()">bomb everything</button>
            </section>
            <section>
                <textarea id="text-area" rows="15" placeholder="Start typing here!"></textarea>
            </section>
        </main>
        <script src="src/main.js"></script>
    </body>
</html>
